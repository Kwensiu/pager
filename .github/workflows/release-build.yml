name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch: # 手动触发
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        default: ''
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'win'
        type: choice
        options:
          - win
      prerelease:
        description: 'Is this a prerelease?'
        required: false
        default: false
        type: boolean
      comparison_tag:
        description: 'Custom comparison tag (optional, defaults to latest tag)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PLATFORM: win
      ARTIFACT_NAME: windows

    outputs:
      version: ${{ steps.resolve_version.outputs.version }}
      tag: ${{ steps.resolve_version.outputs.tag }}
      prerelease: ${{ steps.resolve_version.outputs.prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: |
          pnpm format:check
          pnpm test
          pnpm lint
          pnpm typecheck

      - name: Resolve release version
        id: resolve_version
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $TAG_NAME = "${{ github.event.release.tag_name }}"
            $IS_PRERELEASE = "${{ github.event.release.prerelease }}"
          } else {
            $TAG_NAME = "v${{ github.event.inputs.version }}"
            $IS_PRERELEASE = "${{ github.event.inputs.prerelease }}"
          }

          if ($TAG_NAME -notmatch "^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+|-beta\.[0-9]+|-rc\.[0-9]+)?$") {
            throw "Invalid release tag: $TAG_NAME"
          }

          $VERSION = $TAG_NAME.Substring(1)
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $env:GITHUB_OUTPUT
          echo "prerelease=$IS_PRERELEASE" >> $env:GITHUB_OUTPUT

      - name: Build application
        run: |
          if (Test-Path dist) {
            Remove-Item -Recurse -Force dist
          }
          pnpm build
          pnpm exec electron-builder --win --publish never

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.resolve_version.outputs.tag }}"
          $version = "${{ steps.resolve_version.outputs.version }}"
          if (-not $tag) {
            throw "Release tag is empty"
          }
          if (-not $version) {
            throw "Release version is empty"
          }

          $files = @()
          $files += Get-ChildItem -Path dist -Filter "*-$version-setup.exe" -File | ForEach-Object { $_.FullName }
          $files += Get-ChildItem -Path dist -Filter "*-$version-setup.exe.blockmap" -File | ForEach-Object { $_.FullName }
          $files += Get-ChildItem -Path dist -Filter "latest.yml" -File | ForEach-Object { $_.FullName }

          if ($files.Count -eq 0) {
            throw "No release assets found in dist"
          }

          gh release view $tag --json tagName --jq .tagName
          & gh release upload $tag @files --clobber
